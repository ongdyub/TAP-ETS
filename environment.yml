name: tap-ets
channels:
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
      # pytorch-lightning 2.0.7 imports pkg_resources, removed in setuptools 81.
      - setuptools<81
      - torch==2.4.0
      - pytorch-lightning==2.0.7
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - numpy==1.26.4
      - scipy==1.14.0
      - numba==0.60.0
      - librosa==0.10.2.post1
      - soundfile==0.12.1
      - praat-textgrids==1.4.0
      - tqdm==4.66.4
      - transformers==4.44.0   # Whisper-medium for ASR evaluation
      - python-Levenshtein==0.12.2
